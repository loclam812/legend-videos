<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Bạch Đằng 938: AI stills</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 540px; height: 960px; }
  #cap { position: fixed; left: 27px; width: 486px; top: 600px; text-align: center; font: 900 41px/1.12 "Avenir Next", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; color: #fff; -webkit-text-stroke: 5px #1c0f08; paint-order: stroke fill; text-shadow: 0 3px 8px #000a; }
  #cap .hot { color: #f6c453; }
  #card { position: fixed; left: 0; width: 540px; top: 150px; text-align: center; font-family: Georgia, "Times New Roman", serif; font-weight: 700; color: #f2c14e; -webkit-text-stroke: 6px #2a1608; paint-order: stroke fill; display: none; }
  #card small { display: block; font-size: 24px; color: #fffaf0; -webkit-text-stroke: 4px #2a1608; margin-bottom: 14px; }
  #card b { display: block; font-size: 62px; line-height: 1; }
  #card i { display: block; font-style: normal; font-size: 104px; line-height: 1.05; }
</style></head><body><canvas id="out" width="1080" height="1920"></canvas><div id="cap"></div>
<div id="card"><small>Chuyện lịch sử Việt Nam</small><b>BẠCH ĐẰNG</b><i>938</i></div>
<script src="cut.js"></script>
<script>
// Still images brought to life by code. Everything is a function of time, so the recorder steps frame by frame.
// cut.js (written by quay.js) holds the shot list of bach-dang-shorts: label, transition, text, hot words, seconds.
const W = 864, H = 1536, OW = 1080, OH = 1920, GAP = 0.5, SLIDE = 0.28;

// per shot: cam = two [centreX, centreY, zoom] stops in image pixels; water = [x0, y0, x1, y1] areas that ripple;
// fx = ["motes" | "mist" | "moon" | ["fire", x, y] | "shake"]
const LOOK = {
  "hook": { cam: [[432, 760, 1.05], [420, 700, 1.18]], water: [[0, 1010, 864, 1536]], fx: [["fire", 370, 800], "shake"] },
  "hook 2": { cam: [[432, 700, 1.2], [432, 780, 1]], water: [[0, 800, 864, 1090]], amp: 3, fx: [["fire", 110, 780], "mist"] },
  "1": { cam: [[380, 700, 1], [560, 640, 1.25]] },
  "2": { cam: [[432, 820, 1], [432, 520, 1.15]] },
  "3": { cam: [[432, 700, 1.15], [432, 640, 1]] },
  "3b": { cam: [[432, 760, 1], [432, 520, 1.15]] },
  "5": { cam: [[432, 700, 1], [432, 520, 1.12]], water: [[0, 760, 130, 1000]], amp: 3, fx: [["fire", 707, 1260]] },
  "5b": { cam: [[432, 640, 1.1], [432, 520, 1.22]], water: [[0, 760, 130, 1000]], amp: 3 },
  "6": { cam: [[432, 760, 1], [520, 820, 1.15]] },
  "7": { cam: [[432, 700, 1.05], [432, 820, 1.18]], water: [[0, 1150, 864, 1536]], amp: 3, fx: [] },
  "8": { cam: [[432, 560, 1.15], [432, 760, 1]], water: [[0, 790, 864, 1536]], amp: 5, fx: [] },
  "8b": { cam: [[432, 900, 1.15], [432, 600, 1]], water: [[0, 0, 864, 1536]], amp: 3 },
  "9": { cam: [[432, 760, 1], [432, 640, 1.15]], water: [[0, 1090, 864, 1536]], fx: ["mist"] },
  "9b": { cam: [[432, 900, 1.12], [432, 560, 1]], water: [[0, 1260, 864, 1536]], amp: 3, fx: [] },
  "10": { cam: [[432, 700, 1], [470, 480, 1.18]] },
  "11": { cam: [[432, 900, 1.2], [432, 700, 1]], water: [[0, 1000, 864, 1536]], amp: 5, fx: ["mist", "motes"] },
  "11c": { cam: [[432, 820, 1], [432, 520, 1.15]] },
  "12": { cam: [[432, 720, 1.04], [400, 640, 1.2]], water: [[0, 1190, 864, 1536]], fx: ["shake"] },
  "13": { cam: [[432, 760, 1], [520, 420, 1.18]], water: [[0, 1160, 864, 1536]], fx: [["fire", 170, 800]] },
  "14": { cam: [[432, 760, 1], [400, 420, 1.2]], fx: [] },
  "15": { cam: [[432, 760, 1], [432, 440, 1.15]] },
  "15b": { cam: [[432, 800, 1.15], [432, 700, 1]] },
  "kết": { cam: [[432, 700, 1.1], [432, 700, 1]], water: [[0, 900, 864, 1536]], fx: ["mist"] },
};
const DEFAULT = { cam: [[432, 720, 1], [432, 640, 1.1]], water: [], amp: 4, fx: ["motes"] };

const out = document.getElementById("out").getContext("2d");
const capBox = document.getElementById("cap");
const card = document.getElementById("card");
const canvas = () => Object.assign(document.createElement("canvas"), { width: W, height: H });
const work = canvas().getContext("2d");
const rip = canvas().getContext("2d");
const sm = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };

const bare = (word) => word.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
function chunks(text, hot = [], max = 16) {
  const parts = [];
  let cur = "";
  for (const phrase of hot) text = text.replaceAll(phrase, phrase.replaceAll(" ", " "));
  for (const word of text.split(" ")) {
    const full = cur.length + word.length + 1 > max;
    const pause = /[.!?]$/.test(cur) || (/[,;:]$/.test(cur) && cur.length >= max / 2);
    if (cur && (full || pause)) { parts.push(cur); cur = word; } else cur = cur ? cur + " " + word : word;
  }
  if (cur) parts.push(cur);
  if (parts.length > 1 && !/\s/.test(parts[parts.length - 1])) { const last = parts.pop(); parts[parts.length - 1] += " " + last; }
  return parts;
}
function capHtml(part, hot) {
  const marked = new Set(hot.flatMap((h) => h.split(" ")).map(bare));
  return part.split(/\s+/).map((word) => `<span${marked.has(bare(word)) ? ' class="hot"' : ""}>${word.replace(/[.,;:]+$/, "")}</span>`).join(" ");
}

function waterMask(areas) {
  const c = canvas().getContext("2d");
  c.filter = "blur(28px)";
  c.fillStyle = "#fff";
  for (const [x0, y0, x1, y1] of areas) c.fillRect(x0, y0, x1 - x0, y1 - y0);
  return c.canvas;
}

let at = 0;
const SHOTS = window.CUT.map((cut) => {
  const look = { ...DEFAULT, ...(LOOK[cut.label] || {}) };
  const parts = chunks(cut.text, cut.hot);
  const letters = parts.reduce((sum, p) => sum + p.length, 0);
  let capStart = 0;
  const shot = { ...cut, ...look, t0: at, len: cut.dur + GAP, img: `anh/c-${cut.label.replace(/\s/g, "").replace("kết", "ket")}.jpg`,
    caps: parts.map((p) => { const from = capStart; capStart += (cut.dur * p.length) / letters; return [from, capHtml(p, cut.hot)]; }),
    mask: look.water.length ? waterMask(look.water) : null, top: look.water.length ? Math.min(...look.water.map((a) => a[1])) - 40 : H };
  at += shot.len;
  return shot;
});
window.TOTAL = at + 1.5;
window.STARTS = SHOTS.map((s) => [s.label, s.t0, s.len]);

let view = { s: 1, x: 0, y: 0 };
const place = (ix, iy) => ({ x: ix * view.s + view.x, y: iy * view.s + view.y, s: view.s / 1.25 });

const FX = {
  motes(c, t) {
    c.globalCompositeOperation = "lighter";
    for (let i = 0; i < 22; i++) {
      const x = (rnd(i, 1) * OW + t * (12 + rnd(i, 2) * 26)) % OW;
      const y = (rnd(i, 3) * OH * 0.8 - t * (8 + rnd(i, 4) * 18) + OH) % (OH * 0.8);
      const r = 3 + rnd(i, 5) * 7;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "#fff2c8"); g.addColorStop(1, "#0000");
      c.globalAlpha = 0.25 + 0.3 * Math.abs(Math.sin(t * (0.8 + rnd(i, 6)) + i));
      c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
  },
  mist(c, t) {
    for (let i = 0; i < 5; i++) {
      const x = ((rnd(i, 7) * 1.6 - 0.3) * OW + t * (28 + i * 9)) % (OW * 1.6) - OW * 0.3;
      const y = OH * (0.34 + rnd(i, 8) * 0.16);
      const g = c.createRadialGradient(x, y, 0, x, y, 420);
      g.addColorStop(0, "#fff3dc5c"); g.addColorStop(1, "#fff3dc00");
      c.save(); c.translate(x, y); c.scale(1, 0.32); c.translate(-x, -y);
      c.fillStyle = g; c.fillRect(x - 420, y - 420, 840, 840); c.restore();
    }
  },
  fire(c, t, ix, iy) {
    const p = place(ix, iy), k = 0.55 + 0.25 * Math.sin(t * 13) + 0.2 * Math.sin(t * 7.3 + 1);
    const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 330 * p.s);
    g.addColorStop(0, `rgba(255,170,60,${0.5 * k})`); g.addColorStop(1, "rgba(255,120,30,0)");
    c.globalCompositeOperation = "lighter"; c.fillStyle = g; c.fillRect(0, 0, OW, OH);
    for (let i = 0; i < 34; i++) {
      const life = (t * (0.35 + rnd(i, 9) * 0.4) + rnd(i, 10)) % 1;
      const x = p.x + (rnd(i, 11) - 0.5) * 150 * p.s + Math.sin(t * 2 + i) * 22 + life * (rnd(i, 12) - 0.3) * 170;
      c.globalAlpha = (1 - life) * 0.9;
      c.fillStyle = i % 3 ? "#ffb347" : "#ffe9a8";
      c.beginPath(); c.arc(x, p.y - life * 520 * p.s, 2 + rnd(i, 13) * 3.5, 0, 7); c.fill();
    }
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
  },
};

function drawShot(shot, t, offsetX, alpha = 1) {
  const local = Math.min(shot.len, Math.max(0, t - shot.t0));
  work.drawImage(shot.el, 0, 0);
  if (shot.mask) {
    rip.globalCompositeOperation = "source-over";
    rip.drawImage(shot.el, 0, 0);
    for (let y = Math.max(0, shot.top); y < H; y += 2) {
      const a = shot.amp * Math.min(1, (y - shot.top) / 500);
      const dx = a * Math.sin(y * 0.055 + local * 2.3) + a * 0.5 * Math.sin(y * 0.13 - local * 3.4);
      rip.drawImage(shot.el, 0, y, W, 2, dx, y, W, 2);
    }
    rip.globalCompositeOperation = "destination-in";
    rip.drawImage(shot.mask, 0, 0);
    work.drawImage(rip.canvas, 0, 0);
  }
  const k = sm(0, shot.len, local), [a, b] = shot.cam;
  const cx = a[0] + (b[0] - a[0]) * k, cy = a[1] + (b[1] - a[1]) * k, z = a[2] + (b[2] - a[2]) * k;
  const s = (OW / W) * z;
  const jolt = shot.fx.includes("shake") ? (1 - sm(0, 0.9, local)) * 14 : 0;
  let x = OW / 2 - cx * s + jolt * Math.sin(local * 47), y = OH * 0.42 - cy * s + jolt * Math.cos(local * 39);
  x = Math.min(0, Math.max(OW - W * s, x)); y = Math.min(0, Math.max(OH - H * s, y));
  view = { s, x: x + offsetX, y };
  out.save();
  out.globalAlpha = alpha;
  out.beginPath(); out.rect(offsetX, 0, OW, OH); out.clip();
  out.drawImage(work.canvas, x + offsetX, y, W * s, H * s);
  for (const fx of shot.fx) {
    const [name, ...args] = [].concat(fx);
    if (FX[name]) FX[name](out, local, ...args);
  }
  out.restore();
}

window.renderAt = (t) => {
  let i = SHOTS.findIndex((s) => t < s.t0 + s.len);
  if (i < 0) i = SHOTS.length - 1;
  const shot = SHOTS[i], into = t - shot.t0;
  out.fillStyle = "#000"; out.fillRect(0, 0, OW, OH);
  if (i > 0 && into < SLIDE) {
    const p = sm(0, SLIDE, into);
    if (shot.tr === "whip") { drawShot(SHOTS[i - 1], t, -p * OW); drawShot(shot, t, (1 - p) * OW); }
    else { drawShot(SHOTS[i - 1], t, 0); drawShot(shot, t, 0, p); }
  } else drawShot(shot, t, 0);
  const v = out.createRadialGradient(OW / 2, OH / 2, OH * 0.35, OW / 2, OH / 2, OH * 0.75);
  v.addColorStop(0, "#1a0d0600"); v.addColorStop(1, "#1a0d0688");
  out.fillStyle = v; out.fillRect(0, 0, OW, OH);
  let cap = "";
  for (const [from, html] of shot.caps) if (into >= from && into < shot.dur) cap = html;
  capBox.innerHTML = cap;
  card.style.display = shot.label === "kết" ? "block" : "none";
};

Promise.all(SHOTS.map((s) => new Promise((done, fail) => { s.el = new Image(); s.el.onload = done; s.el.onerror = () => fail(new Error(`missing ${s.img}`)); s.el.src = s.img; }))).then(() => {
  window.renderAt(0);
  window.ready = true;
  if (location.search.includes("play")) { const start = performance.now(); const loop = () => { window.renderAt(((performance.now() - start) / 1000) % window.TOTAL); requestAnimationFrame(loop); }; loop(); }
}, (e) => { document.title = e.message; window.failed = e.message; });
</script></body></html>
