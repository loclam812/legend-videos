<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Bạch Đằng 938: paper-cut</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 540px; height: 960px; }
  #cap { position: fixed; left: 27px; width: 486px; top: 660px; text-align: center; font: 900 41px/1.12 "Avenir Next", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; color: #fff; -webkit-text-stroke: 5px #1c0f08; paint-order: stroke fill; text-shadow: 0 3px 8px #000a; }
  #cap .hot { color: #f6c453; }
  #card { position: fixed; left: 0; width: 540px; top: 170px; text-align: center; font-family: Georgia, "Times New Roman", serif; font-weight: 700; color: #f2c14e; -webkit-text-stroke: 6px #2a1608; paint-order: stroke fill; display: none; }
  #card small { display: block; font-size: 24px; color: #fffaf0; -webkit-text-stroke: 4px #2a1608; margin-bottom: 14px; }
  #card b { display: block; font-size: 62px; line-height: 1; }
  #card i { display: block; font-style: normal; font-size: 104px; line-height: 1.05; }
</style></head><body><canvas id="out" width="1080" height="1920"></canvas><div id="cap"></div>
<div id="card"><small>Chuyện lịch sử Việt Nam</small><b>BẠCH ĐẰNG</b><i>938</i></div>
<script src="cut.js"></script>
<script>
// The paper-cut cut: every moving thing is its own paper layer. Everything is a function of time, so the recorder
// can step frame by frame. cut.js (written by giay-quay.js) is the shot list of bach-dang-shorts.
const OW = 1080, OH = 1920, GAP = 0.5;
const out = document.getElementById("out").getContext("2d");
const capBox = document.getElementById("cap");
const card = document.getElementById("card");
const sm = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
// 0 before `at`, overshoots a little, settles at 1: a paper piece popping in
const pop = (at, t, d = 0.45) => { const x = Math.min(1, Math.max(0, (t - at) / d)); return x === 0 ? 0 : 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2; };
const hop = (t, speed = 7, h = 26) => -Math.abs(Math.sin(t * speed)) * h;

const PLATES = ["pc-sky", "pl-dem", "pl-ngay", "pl-xam", "pl-phu", "pl-han", "pl-rung", "pl-coloa"];
const CUTS = ["pc-nui", "pc-song", "pc-coc", "pc-coc1", "pc-thuyen2", "pc-ghe", "pc-lua", "pc-bo", "pg-ngo", "pg-ngo-kiem", "pg-ngo-vua", "pg-duong", "pg-kieu",
  "pg-cung", "pg-cung-khoc", "pg-thao", "pg-thao-so", "pg-su", "pg-linh", "pg-riu", "pg-dan", "pg-han"];
const L = {};
// which way the generated pieces face, found by looking at them: 1 mirrors the piece
const FLIP = { junk: 1, kieu: 0, linh: 0, ngo: 0, su: 1, riu: 1, ghe: 1, kiem: 0 };

// the generator paints each moving thing on flat magenta: make that transparent and find what is left
function cutOut(img) {
  const c = Object.assign(document.createElement("canvas"), { width: img.width, height: img.height });
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  const data = g.getImageData(0, 0, c.width, c.height), p = data.data;
  // stray specks of unkeyed background must not stretch the box, so a row or column counts only when 2 % of it is solid
  const rows = new Uint32Array(c.height), cols = new Uint32Array(c.width);
  for (let i = 0; i < p.length; i += 4) {
    const pink = Math.min(p[i], p[i + 2]) - p[i + 1];
    const a = 1 - Math.min(1, Math.max(0, (pink - 40) / 60));
    p[i + 3] = a * 255;
    if (a < 1 && a > 0) { p[i] = Math.min(p[i], p[i + 1] + 40); p[i + 2] = Math.min(p[i + 2], p[i + 1] + 40); }
    if (a > 0.5) { rows[Math.floor(i / 4 / c.width)]++; cols[(i / 4) % c.width]++; }
  }
  const span = (counts, min) => { let from = 0, to = counts.length - 1; while (from < to && counts[from] < min) from++; while (to > from && counts[to] < min) to--; return [from, to]; };
  const [y0, y1] = span(rows, c.width * 0.02), [x0, x1] = span(cols, c.height * 0.02);
  g.putImageData(data, 0, 0);
  return { c, x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

// draws the visible part of a layer so that its bottom centre sits at (x, y) and it is `w` wide
function P(name, x, y, w, { rot = 0, flip = 0, alpha = 1, shadow = 1 } = {}) {
  const l = L[name], s = w / l.w;
  out.save();
  out.globalAlpha = alpha;
  out.translate(x, y); out.rotate(rot); if (flip) out.scale(-1, 1);
  if (shadow) { out.shadowColor = "rgba(40,20,10,.5)"; out.shadowBlur = 22; out.shadowOffsetY = 12; }
  out.drawImage(l.c, l.x0, l.y0, l.w, l.h, (-l.w * s) / 2, -l.h * s, l.w * s, l.h * s);
  out.restore();
}
function plate(name, t, total, anchorY = 0.5) {
  const img = L[name], z = 1.03 + 0.04 * sm(0, total, t), s = Math.max(OW / img.width, OH / img.height) * z;
  out.drawImage(img, (OW - img.width * s) / 2, (OH - img.height * s) * anchorY, img.width * s, img.height * s);
}
function rays(x, y, t, alpha = 0.14) {
  out.save();
  out.translate(x, y); out.rotate(t * 0.1); out.globalAlpha = alpha; out.fillStyle = "#fff6d0";
  for (let i = 0; i < 12; i++) { out.rotate(Math.PI / 6); out.beginPath(); out.moveTo(0, 0); out.lineTo(-110, -1700); out.lineTo(110, -1700); out.fill(); }
  out.restore();
}
// a band of paper sea whose wave crests start at `top`; everything below it is filled with its deepest colour
function sea(x, top, w, flip, alpha = 1) {
  const l = L["pc-song"], h = (l.h * w) / l.w;
  out.save(); out.globalAlpha = alpha; out.fillStyle = "#1c3a66"; out.fillRect(0, top + h - 4, OW, OH); out.restore();
  P("pc-song", x, top + h, w, { flip, alpha });
}
const HIGH = 1000, LOW = 1420;
// sky, sun rays, mountains and the far band of sea; the scene adds what floats and then calls front()
function river(sky, t, total, sunY = 440) {
  if (sky === "pc-sky") { const sw = 1100, sh = (sw * L[sky].height) / L[sky].width, y = sunY - 30 * sm(0, total, t); out.drawImage(L[sky], (OW - sw) / 2, y - sh * 0.56, sw, sh); rays(540, y, t); }
  else plate(sky, t, total, 0);
  P("pc-nui", 540 - 18 * Math.sin(t * 0.25), 940, 1180);
  sea(540 + 26 * Math.sin(t * 0.7), 880, 1500, 1);
}
// two bands, so the foreground is waves all the way down instead of a flat fill
const front = (t, top, alpha = 1) => { sea(540 - 30 * Math.sin(t * 0.8 + 1), top + 8 * Math.sin(t * 1.7), 1560, 0, alpha); sea(540 + 34 * Math.sin(t * 0.9), top + 330 + 8 * Math.sin(t * 1.5 + 2), 1700, 1, alpha); };
const stakes = () => P("pc-coc", 540, 1900, 820);
const junk = (x, y, w, t, { tilt = 0, sink = 0 } = {}) => P("pc-thuyen2", x, y + sink, w, { flip: FLIP.junk, rot: (tilt ? 0 : 0.025 * Math.sin(t * 2.2 + x)) + tilt });
const flame = (x, y, w, t) => P("pc-lua", x, y, w * (1 + 0.08 * Math.sin(t * 17)), { rot: 0.06 * Math.sin(t * 11), shadow: 0 });

function tag(text, x, y, rot, k = 1) {
  if (k <= 0) return;
  out.save();
  out.translate(x, y); out.rotate(rot); out.scale(k, k);
  out.font = '800 34px "Avenir Next", "Helvetica Neue", Arial, sans-serif';
  const w = out.measureText(text).width + 44;
  out.shadowColor = "rgba(40,20,10,.5)"; out.shadowBlur = 14; out.shadowOffsetY = 8;
  out.fillStyle = "#fbf3df"; out.fillRect(0, -32, w, 64);
  out.shadowColor = "transparent";
  out.lineWidth = 5; out.strokeStyle = "#2a1608"; out.strokeRect(0, -32, w, 64);
  out.fillStyle = "#2a1608"; out.textBaseline = "middle"; out.fillText(text, 22, 2);
  out.restore();
}
function ring(x, y, r, k) {
  if (k <= 0) return;
  out.save();
  out.strokeStyle = "#f6c453"; out.lineWidth = 9; out.setLineDash([22, 16]); out.lineCap = "round";
  out.shadowColor = "rgba(40,20,10,.6)"; out.shadowBlur = 8; out.shadowOffsetY = 4;
  out.beginPath(); out.arc(x, y, r, 0, Math.PI * 2 * Math.min(1, k)); out.stroke();
  out.restore();
}
function shards(x, y, k, n = 26) {
  if (k <= 0) return;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * (0.15 + 0.7 * rnd(i, 1)), v = 420 + 520 * rnd(i, 2);
    out.save();
    out.translate(x + Math.cos(a) * v * k, y + Math.sin(a) * v * k + 620 * k * k); out.rotate(k * (4 + 8 * rnd(i, 3)) * (i % 2 ? 1 : -1));
    out.globalAlpha = Math.max(0, 1 - k / 2.2);
    out.shadowColor = "rgba(40,20,10,.45)"; out.shadowBlur = 8; out.shadowOffsetY = 5;
    out.fillStyle = ["#7a4a2b", "#c8402f", "#fbf3df", "#a8703f"][i % 4];
    const r = 14 + 26 * rnd(i, 4);
    out.beginPath(); out.moveTo(-r, r * 0.5); out.lineTo(r, r * 0.2); out.lineTo(r * 0.1, -r); out.closePath(); out.fill();
    out.restore();
  }
}
function confetti(t) {
  for (let i = 0; i < 60; i++) {
    const x = (rnd(i, 5) * OW + 60 * Math.sin(t * 1.3 + i) + OW) % OW, y = (rnd(i, 6) * OH + t * (150 + 160 * rnd(i, 7))) % OH;
    out.save(); out.translate(x, y); out.rotate(t * (2 + 3 * rnd(i, 8)) + i);
    out.fillStyle = ["#f2c14e", "#c8402f", "#fbf3df", "#f6a0a0"][i % 4];
    out.shadowColor = "rgba(40,20,10,.35)"; out.shadowBlur = 6; out.shadowOffsetY = 4;
    out.fillRect(-11, -7, 22, 14);
    out.restore();
  }
}
function tears(x, y, t) {
  for (let i = 0; i < 4; i++) {
    const k = (t * 0.7 + i * 0.25) % 1;
    out.save(); out.translate(x + (i % 2 ? 26 : -26), y + k * 260); out.globalAlpha = 1 - k;
    out.fillStyle = "#9fd8f0"; out.strokeStyle = "#2a1608"; out.lineWidth = 4;
    out.beginPath(); out.moveTo(0, -22); out.quadraticCurveTo(18, 6, 0, 16); out.quadraticCurveTo(-18, 6, 0, -22); out.fill(); out.stroke();
    out.restore();
  }
}
function bubble(x, y, r, k) {
  if (k <= 0) return;
  out.save();
  out.translate(x, y); out.scale(k, k);
  out.shadowColor = "rgba(40,20,10,.5)"; out.shadowBlur = 18; out.shadowOffsetY = 10;
  out.fillStyle = "#fbf3df"; out.strokeStyle = "#2a1608"; out.lineWidth = 6;
  out.beginPath(); out.arc(0, 0, r, 0, 7); out.fill(); out.shadowColor = "transparent"; out.stroke();
  [[-r * 0.72, r * 0.95, 26], [-r * 1.0, r * 1.3, 15]].forEach(([bx, by, br]) => { out.beginPath(); out.arc(bx, by, br, 0, 7); out.fill(); out.stroke(); });
  out.restore();
}
const ground = (color, top) => { out.fillStyle = color; out.fillRect(0, top, OW, OH - top); };
const night = () => { out.save(); out.globalCompositeOperation = "multiply"; out.fillStyle = "#7f8fc4"; out.fillRect(0, 0, OW, OH); out.restore(); };
const jolt = (k) => out.translate(k * Math.sin(k * 9.1) * 1.2, k * Math.cos(k * 7.3) * 1.2);

// a scene serves one or more shots in a row: ts = seconds since the scene began, i = which of its shots, u = seconds into that shot
const SCENES = [
  { shots: ["hook", "hook 2"], draw(ts, i, u) {
    out.save(); jolt(16 * (1 - sm(0, 0.8, ts)));
    river("pc-sky", ts, 9);
    junk(900, 1230, 430, ts, { tilt: -0.16, sink: 30 * sm(0, 9, ts) });
    flame(880, 1090, 120, ts);
    junk(600 + 5 * Math.sin(ts * 30) * (1 - sm(0, 1.4, ts)), 1310, 640, ts, { tilt: 0.2 * sm(0, 0.5, ts), sink: 70 * sm(0.3, 9, ts) });
    flame(560, 1150, 190, ts);
    stakes();
    P("pg-han", 250, 1640 + hop(ts, 3, 18), 360, { rot: 0.06 * Math.sin(ts * 3) });
    front(ts, LOW);
    shards(580, 1180, ts);
    out.restore();
    if (i === 1) { tag("NĂM 938", 60, 250, -0.03, pop(0.3, u)); tag("SÔNG BẠCH ĐẰNG", 60, 340, 0.02, pop(1.9, u)); }
  } },
  { shots: ["1"], draw(ts) {
    plate("pl-phu", ts, 6);
    const strike = sm(3.3, 3.7, ts), fall = sm(3.6, 4.6, ts);
    P("pg-duong", 400, 1620 + 180 * fall, 420, { rot: 0.03 * Math.sin(ts * 1.6) - 1.25 * fall, alpha: 1 - 0.75 * fall });
    P("pg-kieu", 1300 - 500 * sm(0.4, 2.8, ts) - 110 * strike, 1640 + hop(ts, 5, 10) * (1 - strike), 420, { flip: FLIP.kieu, rot: -0.16 * strike });
    tag("NĂM 937", 60, 250, -0.03, pop(0.3, ts));
  } },
  { shots: ["2"], draw(ts) {
    plate("pl-ngay", ts, 5, 0);
    P("pc-nui", 540, 1260, 1250);
    ground("#c9a868", 1500);
    P("pc-bo", 540, 1620, 1400);
    const walk = 420 * sm(0, 4.8, ts);
    P("pg-linh", -260 + walk, 1650 + hop(ts, 6, 12), 470, { flip: FLIP.linh });
    P("pg-linh", -40 + walk, 1700 + hop(ts + 0.3, 6, 12), 500, { flip: FLIP.linh });
    P("pg-ngo", 420 + walk, 1730 + hop(ts, 6, 14), 470, { flip: FLIP.ngo });
    tag("TỪ ÁI CHÂU", 60, 250, -0.03, pop(0.4, ts));
  } },
  { shots: ["3", "3b"], draw(ts, i, u) {
    plate("pl-han", ts, 8);
    P("pg-cung", 560, 1560, 600, { rot: 0.02 * Math.sin(ts * 1.4) + (i ? 0.04 * Math.sin(u * 8) * (1 - sm(1, 1.6, u)) : 0) });
    const leave = i ? sm(0, 0.9, u) : 0;
    P("pg-su", -260 + 500 * sm(0.3, 1.8, ts) - 600 * leave, 1700, 340, { flip: FLIP.su, rot: 0.05 * Math.sin(ts * 5) });
    if (i) { P("pg-thao", 800, 1740 + 700 * (1 - pop(0.5, u, 0.6)) + hop(u, 4, 10), 430); tag("LƯU HOẰNG THÁO", 60, 250, -0.03, pop(1.3, u)); }
  } },
  { shots: ["5", "5b"], draw(ts, i, u) {
    river("pc-sky", ts, 8);
    front(ts, 1180);
    ground("#b99a5e", 1560);
    P("pc-bo", 540, 1660, 1400);
    P("pg-linh", 860, 1700, 400, { flip: !FLIP.linh, rot: 0.02 * Math.sin(ts * 2) });
    P("pg-ngo", 360, 1720 + (i ? hop(u, 5, 18) : 0), 480, { flip: FLIP.ngo, rot: 0.02 * Math.sin(ts * 1.8) });
    const k = i ? 1 : pop(1.1, u), grow = i ? 40 * sm(0, 0.6, u) : 0;
    bubble(760, 560, 190 + grow, k);
    if (k > 0) P("pc-coc1", 760, 700 + grow, 60 * k, { shadow: 0 });
    if (i) { ring(760, 420, 86, sm(1.2, 1.8, u)); tag("CỌC GỖ BỊT SẮT", 560, 840, 0.03, pop(1.6, u)); }
  } },
  { shots: ["6"], draw(ts) {
    plate("pl-rung", ts, 5);
    for (let n = 0; n < 5; n++) { const k = pop(0.6 + n * 0.7, ts); if (k > 0) P("pc-coc1", 250 + n * 20, 1760 - n * 46, 70 * k, { rot: Math.PI / 2 - 0.04 * n }); }
    P("pg-riu", 300, 1600, 440, { flip: FLIP.riu, rot: 0.14 * Math.sin(ts * 6) });
    P("pg-riu", 820, 1640, 400, { flip: !FLIP.riu, rot: 0.14 * Math.sin(ts * 6 + 2) });
    shards(560, 1500, (ts % 1.05) * 0.5, 8);
  } },
  { shots: ["7"], draw(ts) {
    const STAKE_H = (64 * L["pc-coc1"].h) / L["pc-coc1"].w;
    river("pl-ngay", ts, 5);
    P("pc-ghe", 300, 1330 + 10 * Math.sin(ts * 2.4), 520, { flip: FLIP.ghe, rot: 0.03 * Math.sin(ts * 2.4) });
    for (let n = 0; n < 5; n++) { const d = sm(0.4 + n * 0.6, 0.75 + n * 0.6, ts); if (d > 0) P("pc-coc1", 470 + n * 120, 1170 + STAKE_H * (0.1 + 0.9 * d) - 26 * Math.sin(Math.PI * sm(0.75 + n * 0.6, 1.05 + n * 0.6, ts)), 64); }
    front(ts, 1330);
    tag("CỬA SÔNG BẠCH ĐẰNG", 60, 250, -0.03, pop(0.4, ts));
  } },
  { shots: ["8", "8b"], draw(ts, i, u) {
    river("pl-dem", ts, 8);
    stakes();
    front(ts, i ? HIGH : LOW - (LOW - HIGH) * sm(0.3, 3, u), i ? 1 - 0.5 * sm(0.2, 1, u) : 1);
    night();
    tag("NƯỚC LỚN", 60, 250, -0.03, i ? 1 : pop(2.6, u));
    if (i) [[218, 1100], [540, 1100], [862, 1100]].forEach(([x, y], n) => ring(x, y, 80, sm(0.6 + n * 0.4, 1.2 + n * 0.4, u)));
  } },
  { shots: ["9", "9b", "10"], draw(ts, i, u) {
    river("pl-xam", ts, 12);
    const drift = 70 * sm(4, 12, ts) + (i === 2 ? 160 * sm(0.4, 3, u) : 0), come = sm(0.2, 3.4, ts);
    junk(1500 - 520 * come - drift, 1060, 360, ts);
    junk(1700 - 480 * come - drift, 1120, 520, ts);
    junk(1420 - 800 * come - drift, 1180, 640, ts);
    if (i) P("pc-ghe", 760 - 560 * sm(0, 7, ts - 4.2), 1150 + 8 * Math.sin(ts * 3), 380, { flip: FLIP.ghe, rot: 0.04 * Math.sin(ts * 3) });
    front(ts, HIGH + 60);
    if (i === 2) P("pg-thao", 830, 1760 + 700 * (1 - pop(0.3, u, 0.5)) + hop(u, 7, 22), 440);
    tag("NƯỚC LỚN", 60, 250, -0.03);
  } },
  { shots: ["11", "11c", "12", "13"], draw(ts, i, u) {
    const done = i > 2 ? 1 : 0, since = i === 2 ? u - 1.5 : -1;
    out.save(); if (since > 0 && since < 0.8) jolt(16 * (1 - since / 0.8));
    river("pc-sky", ts, 16);
    const ebb = i ? 1 : sm(0.3, 3.3, u), sink2 = i === 3 ? sm(0.3, 3, u) : 0;
    junk(960 - (i === 3 ? 120 * sm(0, 0.5, u) : 0), 1220, 440, ts, { tilt: -0.2 * sink2, sink: 80 * sink2 });
    if (i === 3) { const fly = sm(0.5, 1.9, u); P("pg-thao-so", 940 - 260 * fly, 1150 - 420 * Math.sin(Math.PI * fly) + 500 * fly * fly, 300, { rot: -2.2 * fly }); }
    const go = i === 2 ? sm(0, 1.5, u) : done, wreck = i === 2 ? sm(1.5, 3.6, u) : done;
    junk(900 - 300 * go + (i === 2 && since > 0 ? 5 * Math.sin(ts * 30) * (1 - sm(1.6, 3, u)) : 0), 1310, 640, ts, { tilt: 0.22 * wreck, sink: 110 * wreck });
    if (i === 3) flame(560, 1190, 200, ts);
    stakes();
    if (i === 3) P("pg-han", 240, 1650 + hop(ts, 3, 18), 340, { rot: 0.06 * Math.sin(ts * 3) });
    if (i === 1) P("pc-ghe", -300 + 520 * sm(0, 2, u), 1500 + 8 * Math.sin(ts * 3), 460, { flip: !FLIP.ghe, rot: 0.03 * Math.sin(ts * 3) });
    front(ts, HIGH + (LOW - HIGH) * ebb);
    if (i === 1) P("pg-ngo-kiem", 300, 1760 + 800 * (1 - pop(0.2, u, 0.5)) + hop(u, 6, 24), 430, { flip: FLIP.kiem });
    if (since > 0) shards(580, 1180, since);
    out.restore();
    tag("NĂM 938", 60, 250, -0.03);
    tag(ebb < 0.15 ? "NƯỚC LỚN" : ebb < 0.95 ? "NƯỚC ĐANG RÚT ▼" : "NƯỚC RÒNG", 60, 340, 0.02);
  } },
  { shots: ["14"], draw(ts) {
    river("pl-xam", ts, 5);
    const away = sm(0, 5, ts);
    P("pc-thuyen2", 620 + 520 * away, 1040, 300 - 60 * away, { flip: !FLIP.junk, rot: 0.03 * Math.sin(ts * 2) });
    P("pc-thuyen2", 380 + 420 * away, 1080, 240 - 40 * away, { flip: !FLIP.junk, rot: 0.03 * Math.sin(ts * 2 + 1) });
    front(ts, 1200);
    ground("#a99e86", 1580);
    P("pc-bo", 540, 1680, 1400);
    P("pg-cung-khoc", 420, 1740, 480, { rot: 0.035 * Math.sin(ts * 1.5) });
    tears(420, 1010, ts);
  } },
  { shots: ["15", "15b"], draw(ts, i, u) {
    plate("pl-coloa", ts, 9);
    rays(540, 520, ts * 2, 0.16);
    if (i) { P("pg-dan", 210, 1760 + hop(u, 6, 30), 470); P("pg-dan", 880, 1780 + hop(u + 0.25, 6, 30), 470, { flip: 1 }); }
    P("pg-ngo-vua", 540, 1700 + 900 * (1 - pop(0.3, ts, 0.7)) + (i ? hop(u, 5, 16) : 0), 520);
    if (i) confetti(u);
    tag("NĂM 939 · CỔ LOA", 60, 250, -0.03, pop(1.2, ts));
  } },
  { shots: ["kết"], draw(ts) {
    river("pc-sky", ts, 6, 620);
    front(ts, 1300);
  } },
];

const bare = (word) => word.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
function chunks(text, hot = [], max = 16) {
  const parts = [];
  let cur = "";
  for (const phrase of hot) text = text.replaceAll(phrase, phrase.replaceAll(" ", " "));
  for (const word of text.split(" ")) {
    const full = cur.length + word.length + 1 > max;
    const pause = /[.!?]$/.test(cur) || (/[,;:]$/.test(cur) && cur.length >= max / 2);
    if (cur && (full || pause)) { parts.push(cur); cur = word; } else cur = cur ? cur + " " + word : word;
  }
  if (cur) parts.push(cur);
  if (parts.length > 1 && !/\s/.test(parts[parts.length - 1])) { const last = parts.pop(); parts[parts.length - 1] += " " + last; }
  return parts;
}
function capHtml(part, hot) {
  const marked = new Set(hot.flatMap((h) => h.split(" ")).map(bare));
  return part.split(/\s+/).map((word) => `<span${marked.has(bare(word)) ? ' class="hot"' : ""}>${word.replace(/[.,;:]+$/, "")}</span>`).join(" ");
}

let at = 0;
const SHOTS = window.CUT.map((cut) => {
  const parts = chunks(cut.text, cut.hot), letters = parts.reduce((sum, p) => sum + p.length, 0);
  let capStart = 0;
  const scene = SCENES.find((s) => s.shots.includes(cut.label));
  const shot = { ...cut, t0: at, len: cut.dur + GAP, scene, i: scene.shots.indexOf(cut.label),
    caps: parts.map((p) => { const from = capStart; capStart += (cut.dur * p.length) / letters; return [from, capHtml(p, cut.hot)]; }) };
  if (shot.i === 0) scene.t0 = at;
  at += shot.len;
  return shot;
});
window.TOTAL = at + 1.5;
window.STARTS = SHOTS.map((s) => [s.label, s.t0, s.len]);

const grain = Object.assign(document.createElement("canvas"), { width: 270, height: 480 });
{ const g = grain.getContext("2d"), d = g.createImageData(270, 480); for (let i = 0; i < d.data.length; i += 4) { const v = 110 + rnd(i, 3) * 145; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 46; } g.putImageData(d, 0, 0); }

window.renderAt = (t) => {
  let n = SHOTS.findIndex((s) => t < s.t0 + s.len);
  if (n < 0) n = SHOTS.length - 1;
  const shot = SHOTS[n], u = Math.min(t - shot.t0, shot.len);
  out.fillStyle = "#1a0d06"; out.fillRect(0, 0, OW, OH);
  shot.scene.draw(shot.t0 + u - shot.scene.t0, shot.i, u);

  // a sheet of paper slides across whenever the scene changes
  const edge = SHOTS.find((s) => s.i === 0 && s.t0 > 0 && Math.abs(t - s.t0) < 0.22);
  if (edge) {
    const k = (t - edge.t0) / 0.22, x = k < 0 ? OW * -k : -OW * k;
    out.save(); out.shadowColor = "rgba(40,20,10,.6)"; out.shadowBlur = 40; out.fillStyle = "#f3e7c9"; out.fillRect(x - 40, 0, OW + 80, OH); out.restore();
  }
  out.globalCompositeOperation = "multiply";
  out.drawImage(grain, 0, 0, OW, OH);
  out.globalCompositeOperation = "source-over";
  const v = out.createRadialGradient(OW / 2, OH / 2, OH * 0.35, OW / 2, OH / 2, OH * 0.75);
  v.addColorStop(0, "#1a0d0600"); v.addColorStop(1, "#1a0d0677");
  out.fillStyle = v; out.fillRect(0, 0, OW, OH);

  let cap = "";
  for (const [from, html] of shot.caps) if (u >= from && u < shot.dur) cap = html;
  capBox.innerHTML = cap;
  card.style.display = shot.label === "kết" ? "block" : "none";
};

const load = (name) => new Promise((done, fail) => { const el = new Image(); el.onload = () => done([name, el]); const src = `anh/${name}.${PLATES.includes(name) ? "jpg" : "png"}`; el.onerror = () => fail(new Error(`missing ${src}`)); el.src = src; });
Promise.all([...PLATES, ...CUTS].map(load)).then((all) => {
  for (const [name, el] of all) L[name] = PLATES.includes(name) ? el : cutOut(el);
  window.renderAt(0);
  window.ready = true;
  if (location.search.includes("play")) { const start = performance.now(); const loop = () => { window.renderAt(((performance.now() - start) / 1000) % window.TOTAL); requestAnimationFrame(loop); }; loop(); }
}, (e) => { window.failed = e.message; });
</script></body></html>
