<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thánh Gióng</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c130e; color: #f6ead2; font-family: Georgia, "Times New Roman", serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .stage { position: relative; width: min(96vw, calc(84vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: #000; box-shadow: 0 12px 40px #000a; }
  .stage:fullscreen { width: 100vw; height: 100vh; border-radius: 0; }
  .stage:fullscreen svg { object-fit: contain; }
  svg { display: block; width: 100%; height: 100%; }
  #cap { position: absolute; left: 5%; right: 5%; bottom: 4.5%; text-align: center; font-size: clamp(13px, 2.1vw, 34px); line-height: 1.4; text-shadow: 0 2px 6px #000, 0 0 3px #000, 0 0 12px #000; }
  #cap .who { color: #f6c453; font-weight: bold; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 0 16px; }
  button { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 6px; border: 1px solid #c9a15a; background: #3a2418; color: #f6ead2; cursor: pointer; }
  button:hover { background: #55351f; }
  #label { min-width: 9em; text-align: center; font-size: 15px; opacity: .85; }

  .scene { display: none; }
  .scene.on, .scene.prev { display: block; }
  .scene.on { animation: fadein .9s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; } }
  .scene.on[data-tr="slide"] { animation: slidein .85s cubic-bezier(.65, 0, .2, 1) both; }
  .scene.prev[data-out="slide"] { animation: slideout .85s cubic-bezier(.65, 0, .2, 1) both; }
  @keyframes slidein { from { transform: translateX(1600px); } }
  @keyframes slideout { to { transform: translateX(-1600px); } }
  .scene.on[data-tr="zoom"] { transform-origin: 800px 450px; animation: zoomin 1s ease-out both; }
  @keyframes zoomin { from { opacity: 0; transform: scale(1.3); } }
  .scene.on[data-tr="black"] { animation: fadein .6s ease .6s both; }
  .scene.prev[data-out="black"] { animation: fadeout .6s ease both; }

  .bob { animation: bob 2.6s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  .wave { animation: wave 5s linear infinite; }
  @keyframes wave { to { transform: translateX(-100px); } }
  .sway { transform-origin: 0px -300px; animation: sway 3.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .flap { animation: flap .45s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(-.4); } }
  .fly { animation: fly 13s linear infinite; }
  @keyframes fly { from { transform: translate(-700px, 40px); } to { transform: translate(1500px, -40px); } }
  .flick { animation: flick .35s ease-in-out infinite alternate; }
  @keyframes flick { to { transform: scale(1.12, 1.2); } }
  .rock { animation: rock 3s ease-in-out infinite alternate; }
  @keyframes rock { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  .peck { animation: peck .6s ease-in-out infinite alternate; }
  @keyframes peck { to { transform: rotate(16deg); } }
  .away { animation: away 24s linear forwards; }
  @keyframes away { to { transform: translateX(260px); } }
  .drift { animation: drift 20s linear forwards; }
  @keyframes drift { to { transform: translate(120px, -14px); } }
  .cloud { animation: cloud 40s linear infinite alternate; }
  @keyframes cloud { to { transform: translateX(90px); } }
  .foam { animation: foam 3.5s ease-in-out infinite alternate; }
  @keyframes foam { to { transform: translate(14px, 7px); } }
  .glint { animation: glint 1.6s ease-in-out infinite alternate; }
  @keyframes glint { from { opacity: .3; } to { opacity: .9; } }
  .swing { animation: swing var(--t, 1s) ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes swing { to { transform: rotate(var(--a)); } }
  .blink { transform-origin: 0px -233px; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .mouth { transform-origin: 0px -216px; }
  [data-talk="Gióng"] [data-name="Gióng"] .mouth, [data-talk="Mẹ"] [data-name="Mẹ"] .mouth,
  [data-talk="Sứ giả"] [data-name="Sứ giả"] .mouth, [data-talk="Vua Hùng"] [data-name="Vua Hùng"] .mouth { animation: talk .2s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: scaleY(.5); } to { transform: scaleY(2.4); } }
  .jump { animation: jump .38s ease-out infinite alternate; }
  @keyframes jump { to { transform: translateY(-26px); } }
  .tremble { animation: tremble .11s linear infinite alternate; }
  @keyframes tremble { from { transform: translateX(-2.5px); } to { transform: translateX(2.5px); } }
  .walk { animation: walkin var(--t) ease-out var(--d, 0s) both; }
  @keyframes walkin { from { transform: translate(var(--dx), var(--dy)); } to { transform: none; } }
  .step { animation: step .3s ease-in-out var(--d, 0s) var(--n) alternate; }
  @keyframes step { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .pop { animation: pop .9s cubic-bezier(.3, 1.5, .5, 1) var(--d, 0s) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .grow { animation: grow var(--t, 6s) ease-in-out var(--d, 0s) both; }
  @keyframes grow { from { transform: scale(var(--from, .45)); } }
  .gone { animation: fadeout .5s ease var(--d, 0s) both; }
  .swim { animation: swim 2.4s ease-in-out infinite alternate; }
  @keyframes swim { to { transform: translate(-60px, 8px); } }
  .rain { animation: rain .45s linear infinite; }
  @keyframes rain { to { transform: translate(-61px, 200px); } }
  .flash { opacity: 0; animation: flash 3.2s linear infinite; }
  @keyframes flash { 0%, 86%, 100% { opacity: 0; } 88%, 93% { opacity: 1; } 90% { opacity: .25; } }
  .smoke { fill: none; stroke: #fff8e8; stroke-width: 7; stroke-linecap: round; opacity: 0; animation: smoke 5s ease-in-out infinite; }
  @keyframes smoke { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-70px); } }
  .petal { fill: #f29bb0; opacity: 0; animation: fall 7s linear infinite; }
  @keyframes fall { 0% { opacity: 0; transform: translate(0, 0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(90px, 330px) rotate(260deg); } }
  @media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg viewBox="0 0 1600 900" style="background:#000" role="img" aria-label="Hoạt hình Thánh Gióng">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
        <feColorMatrix values="0 0 0 0 .23  0 0 0 0 .14  0 0 0 0 .09  0 0 0 .22 0"/>
      </filter>
      <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c090"/><stop offset="1" stop-color="#c4845a"/></linearGradient>
      <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1608" stop-opacity="0"/><stop offset="1" stop-color="#2a1608" stop-opacity=".34"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#fff3c0" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc56a" stop-opacity=".4"/><stop offset="1" stop-color="#ffc56a" stop-opacity="0"/></radialGradient>
      <radialGradient id="vignette" r=".75"><stop offset=".55" stop-color="#1a0d06" stop-opacity="0"/><stop offset="1" stop-color="#1a0d06" stop-opacity=".5"/></radialGradient>
      <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
      <path id="frond" d="M0 0C70 -70 190 -70 280 14C190 -18 80 -8 0 0Z"/>
      <path id="gull" d="M0 0C-20 -30 -60 -40 -92 -18C-60 -24 -30 -8 -8 10L0 16L8 10C30 -8 60 -24 92 -18C60 -40 20 -30 0 0Z"/>
    </defs>
    <g id="scenes"></g>
    <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
    <rect width="1600" height="900" filter="url(#grain)" pointer-events="none"/>
  </svg>
  <div id="cap"><span class="who"></span><span class="txt">Bấm “Phát” để bắt đầu</span></div>
</div>

<div class="controls">
  <button id="prev" aria-label="Cảnh trước">◀</button>
  <span id="label"></span>
  <button id="next" aria-label="Cảnh sau">▶</button>
  <button id="play">Phát</button>
  <button id="playVoice">Phát kèm giọng đọc</button>
  <button id="full">Toàn màn hình</button>
</div>

<script src="helpers.js"></script>
<script src="people.js"></script>
<script src="shots-a.js"></script>
<script src="shots-b.js"></script>
<script src="player.js"></script>
</body>
</html>
